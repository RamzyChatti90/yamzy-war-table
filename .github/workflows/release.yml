name: Release WAR TABLE Extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-backend-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RamzyChatti90/yamzy-world
          path: yamzy-world
          token: ${{ secrets.YAMZY_REPO_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build extension JAR (subset pos package)
        working-directory: yamzy-world/backend
        run: |
          mvn -pl :war-table-backend -am package -DskipTests
          mv target/war-table-backend-*.jar ../../war-table-backend-${{ github.ref_name }}.jar

      - name: Compute SHA256
        run: |
          sha256sum war-table-backend-${{ github.ref_name }}.jar > sha256.txt
          cat sha256.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            war-table-backend-${{ github.ref_name }}.jar
            sha256.txt
            extension.json
          generate_release_notes: true

  build-frontend-docker:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ramzychatti90/yamzy-war-table-frontend:${{ github.ref_name }}
            ghcr.io/ramzychatti90/yamzy-war-table-frontend:latest

  update-manifest-checksum:
    needs: build-backend-jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { token: ${{ secrets.PAT }} }

      - name: Download sha256.txt from release
        run: |
          gh release download ${{ github.ref_name }} -p 'sha256.txt'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Patch extension.json with checksum
        run: |
          SHA=$(awk '{print $1}' sha256.txt)
          jq ".backend.jarSha256 = \"$SHA\"" extension.json > tmp.json
          mv tmp.json extension.json

      - name: Commit checksum
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add extension.json
          git commit -m "chore: update jarSha256 for ${{ github.ref_name }}" || true
          git push
